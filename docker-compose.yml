services:
  rig:
    build: .
    image: skintokens-rig
    container_name: skintokens-rig
    environment:
      # --use_transfer is always on (maintains original texture/topology while applying the generated rig).
      # Extra demo.py flags, e.g. EXTRA_ARGS=--use_postprocess
      EXTRA_ARGS: ${EXTRA_ARGS:-}
    volumes:
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./input:/app/input
      - ./results:/app/results
      - skintokens_experiments:/app/experiments
      - skintokens_models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  rename:
    build:
      context: .
      dockerfile: Dockerfile.rename
    image: skintokens-rename
    container_name: skintokens-rename
    volumes:
      - ./results:/results
      - ./mappings:/mappings:ro

volumes:
  skintokens_experiments:
  skintokens_models:
